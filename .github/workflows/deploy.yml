name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Every step, not just the build: several modules construct the Supabase
    # client at import time. CI used to get these from a committed .env.local,
    # which is no longer in the repository and should never have been.
    env:
      PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      PUBLIC_GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.PUBLIC_GOOGLE_MAPS_BROWSER_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx svelte-check --tsconfig ./tsconfig.json
      - run: npm run build
        env:
          # Pages serves the site from /<repo>, so assets need that prefix.
          BASE_PATH: /${{ github.event.repository.name }}
      # Gates the upload: a build missing index.html would publish a site that
      # 404s at its own root.
      - run: ./scripts/check-build.sh
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: build

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
