<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- user-scalable=no is a deliberate trade: it stops the double-tap and
		     pinch zoom that make a web app feel like a web page. The map keeps
		     pinch-to-zoom because Leaflet implements that itself in JS, not via
		     browser zoom. Cost: readers who zoom to enlarge text cannot here, so
		     the type scale has a 15px floor and respects system text size. -->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbf9f7" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#2b2724" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="TravelMate" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icon-192.png" />
		<link rel="icon" href="%sveltekit.assets%/icon-192.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
